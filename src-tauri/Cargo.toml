[package]
name = "ai-usage-widget"
version = "0.1.3"
description = "AI Usage floating widget (Tauri)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Pin below time 0.3.52: that release changed `Parsable::parse`'s signature and
# breaks tauri's transitive `cookie 0.18.1` (whose time range is too loose).
# 0.3.49 still has the 1-arg parse cookie expects.
time = "=0.3.49"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
